# Ambiente local do execution-service: API + LocalStack (SNS/SQS/DynamoDB com a mesma topologia
# do Terraform, criada por deploy/localstack/init-aws.sh, e TTL ligado por enable-ttl.sh).
# A porta 8083 é a que o os-service usa por padrão em EXECUTION_SERVICE_URL.
services:
  execution-service:
    build: .
    container_name: execution-service
    ports:
      - "${EXECUTION_SERVICE_PORT:-8083}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      DYNAMODB_TABLE: executions
      SQS_EXECUTION_COMMANDS_URL: http://localstack:4566/000000000000/execution-commands
      SNS_EXECUTION_EVENTS_ARN: arn:aws:sns:us-east-1:000000000000:execution-events
      FAULT_INJECTION_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.14.0  # fixada: tags mais novas podem exigir LOCALSTACK_AUTH_TOKEN
    container_name: tc4-exec-localstack
    ports:
      - "${LOCALSTACK_PORT:-4568}:4566"
    environment:
      SERVICES: sns,sqs,dynamodb
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./deploy/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ./deploy/localstack/enable-ttl.sh:/etc/localstack/init/ready.d/init-zz-execution-ttl.sh:ro
    healthcheck:
      # Pronto quando os scripts de init (filas, tópicos, tabelas) terminaram sem erro. O endpoint responde
      # em milissegundos; o awslocal leva uns 3 s para subir e estourava o timeout.
      test: ["CMD-SHELL", "r=$$(curl -sf localhost:4566/_localstack/init/ready) && echo \"$$r\" | grep -q '\"completed\": true' && ! echo \"$$r\" | grep -q ERROR"]
      interval: 5s
      timeout: 5s
      retries: 30
