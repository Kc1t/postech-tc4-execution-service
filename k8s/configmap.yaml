apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-service-config
data:
  APP_PORT: "8080"
  APP_ENV: "prod"
  LOG_LEVEL: "info"
  NEW_RELIC_APP_NAME: "execution-service-NAMESPACE_PLACEHOLDER"
  CORS_ALLOWED_ORIGINS: "CORS_ORIGINS_PLACEHOLDER"
  # AWS: credenciais vêm do role do node (LabRole no Learner Lab); AWS_ENDPOINT_URL fica vazio.
  AWS_REGION: "AWS_REGION_PLACEHOLDER"
  DYNAMODB_TABLE: "executions"
  SQS_EXECUTION_COMMANDS_URL: "https://sqs.AWS_REGION_PLACEHOLDER.amazonaws.com/ACCOUNT_ID_PLACEHOLDER/execution-commands"
  SNS_EXECUTION_EVENTS_ARN: "arn:aws:sns:AWS_REGION_PLACEHOLDER:ACCOUNT_ID_PLACEHOLDER:execution-events"
  MAX_CONCURRENT_REPAIRS: "10"
  FAULT_INJECTION_ENABLED: "FAULT_INJECTION_PLACEHOLDER"
  OUTBOX_POLL_INTERVAL: "500ms"
  # Menor que terminationGracePeriodSeconds (30s) menos o preStop (5s).
  SHUTDOWN_TIMEOUT: "20s"
